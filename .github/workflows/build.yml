name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang API ID dan Hash
        env:
          API_ID: ${{ secrets.TG_API_ID }}
          API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/APP_ID = [0-9]*;/APP_ID = ${API_ID};/" $F
          sed -i "s/APP_HASH = \"[^\"]*\"/APP_HASH = \"${API_HASH}\"/" $F
          grep -n "APP_ID\|APP_HASH" $F | sed 's/"[^"]*"/"***"/'

      - name: Terima lisensi SDK
        run: yes | sdkmanager --licenses || true

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: likgram-apk
          path: "**/build/outputs/apk/**/*.apk"
